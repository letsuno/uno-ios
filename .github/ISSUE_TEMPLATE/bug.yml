name: Bug report
description: Report a reproducible problem in the iOS client
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Device and system
      placeholder: iPhone 17 Pro, iOS 26.0
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      description: Shown on the server connection screen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Connect to ...
        2. Join ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Remove credentials, tokens, room codes, and personal data before attaching logs.
