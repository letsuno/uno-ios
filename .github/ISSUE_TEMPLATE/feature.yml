name: Feature request
description: Propose an improvement to the iOS client
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem rather than only the proposed interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Server compatibility
      description: Note whether this requires a server or protocol change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
