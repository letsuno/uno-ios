name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: Enable extra build diagnostics
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Show runner context
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          xcodebuild -version
          xcrun swift-format --version

      - name: Lint Swift sources
        run: make quality

  build:
    name: Release Build
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BUILD_LOG: release-build.log
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Show runner context
        run: |
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          xcodebuild -version
          swift --version

      - name: Show build settings
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        run: make show-settings

      - name: Build release configuration
        run: |
          set -o pipefail
          make build DERIVED_DATA_PATH="${RUNNER_TEMP}/DerivedData" 2>&1 | tee "${BUILD_LOG}"

      - name: Analyze release configuration
        run: |
          set -o pipefail
          make analyze DERIVED_DATA_PATH="${RUNNER_TEMP}/DerivedData" 2>&1 | tee -a "${BUILD_LOG}"

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-log
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 20
    env:
      TEST_LOG: test.log
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "${simulator_id}"
          echo "id=${simulator_id}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: |
          set -o pipefail
          make test \
            TEST_DESTINATION='platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            DERIVED_DATA_PATH="${RUNNER_TEMP}/DerivedData" \
            RESULT_BUNDLE_PATH="${RUNNER_TEMP}/TestResults.xcresult" \
            2>&1 | tee "${TEST_LOG}"

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          path: |
            ${{ env.TEST_LOG }}
            ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

  result:
    name: Required Checks
    if: always()
    needs:
      - quality
      - build
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI layer
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          failed=false
          for result in "${QUALITY_RESULT}" "${BUILD_RESULT}" "${TEST_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              failed=true
            fi
          done
          if [[ "${failed}" == "true" ]]; then
            echo "::error::At least one required CI layer did not succeed."
            exit 1
          fi
          echo "All required CI layers succeeded."
